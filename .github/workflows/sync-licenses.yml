name: Sync Third-Party Licenses

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = report drift, update = open a review PR"
        type: choice
        required: true
        default: update
        options:
          - check
          - update
  push:
    branches: [main]
    paths:
      - "scripts/fetch-session.sh"
      - "scripts/sync-licenses.py"
      - "LICENSE"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pascal Automation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 5495945
          private-key: ${{ secrets.PASCAL_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: skillsmith

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Wait for the pin sync PR
        id: pins
        run: |
          if grep -qE '^[A-Z0-9]+_SHA=""$' scripts/fetch-session.sh; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "A third-party skill is awaiting its pinned SHA; license sync will retry after the pin PR."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.pins.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install YAML parser
        if: steps.pins.outputs.ready == 'true'
        run: pip install pyyaml

      - name: Check license declarations
        if: steps.pins.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        run: python scripts/sync-licenses.py --check

      - name: Update license declarations
        if: steps.pins.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'update')
        run: python scripts/sync-licenses.py --write

      - name: Open review pull request
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'update'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --check
          if git diff --quiet -- LICENSE; then
            echo "No license changes."
            exit 0
          fi
          git config user.name "pascal-automation-agent[bot]"
          git config user.email "348848148+pascal-automation-agent[bot]@users.noreply.github.com"
          git checkout -B chore/sync-licenses
          git add LICENSE
          cat > /tmp/licenses-commit-message.txt <<'EOF'
          chore(licenses): sync third-party skill declarations

          Work done:
          - Refresh the third-party license inventory from pinned upstream skill declarations.
          - Include upstream license metadata or the applicable root license-file reference.

          Effect:
          - LICENSE reflects the declarations associated with the currently pinned third-party skills.

          Benefits:
          - Reviewers can inspect upstream licensing information before fetched skills are used or redistributed.

          Files changed: LICENSE
          EOF
          git commit -F /tmp/licenses-commit-message.txt
          git push --force origin chore/sync-licenses
          cat > /tmp/licenses-pr-body.md <<'EOF'
          Work done:
          - Refresh the third-party license inventory from pinned upstream skill declarations.
          - Include upstream license metadata or the applicable root license-file reference.

          Effect:
          - LICENSE reflects the declarations associated with the currently pinned third-party skills.

          Benefits:
          - Reviewers can inspect upstream licensing information before fetched skills are used or redistributed.

          Files changed: LICENSE
          EOF
          URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head chore/sync-licenses --state open --json url --jq '.[0].url // empty')
          if [ -z "$URL" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head chore/sync-licenses --base main \
              --title "chore(licenses): sync third-party skill declarations" \
              --body-file /tmp/licenses-pr-body.md
          else
            gh pr edit "$URL" \
              --title "chore(licenses): sync third-party skill declarations" \
              --body-file /tmp/licenses-pr-body.md
          fi
