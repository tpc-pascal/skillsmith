name: Sync Pins — Update Upstream SHAs

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-session.sh"
      - "scripts/bump-pins.sh"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = report only, update = open a review PR"
        type: choice
        required: true
        default: update
        options:
          - check
          - update

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: 5495945
          private-key: ${{ secrets.PASCAL_AUTOMATION_PRIVATE_KEY }}
          owner: tpc-pascal
          repositories: skillsmith
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump Pin SHAs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "check" ]; then
            bash scripts/bump-pins.sh --check
          else
            bash scripts/bump-pins.sh --write
          fi

      - name: Show Report
        if: always()
        run: |
          cat pins-report.md 2>/dev/null || true
          cat pins-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Report Unreachable Upstreams
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          [ -s unreachable.txt ] || { echo "all upstreams reachable"; exit 0; }
          TITLE="sync-pins: unreachable upstream"
          { echo "Auto-detected unreachable pinned upstreams:"; echo; echo '```'; cat unreachable.txt; echo '```'; } > /tmp/unreach.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/unreach.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/unreach.md
          fi
          exit 1

      - name: Open Pull Request
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'update'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --quiet scripts/fetch-session.sh && { echo "No drift — pins already track upstream HEAD"; exit 0; }
          git config user.name "pascal-automation-agent[bot]"
          git config user.email "348848148+pascal-automation-agent[bot]@users.noreply.github.com"
          git checkout -B chore/sync-pins
          git add scripts/fetch-session.sh
          git commit -m "chore(pins): bump third-party skill SHAs to upstream HEAD"
          git push --force origin chore/sync-pins
          URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head chore/sync-pins --state open --json url --jq '.[0].url // empty')
          if [ -z "$URL" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head chore/sync-pins --base main \
              --title "chore(pins): bump third-party skill SHAs to upstream HEAD" \
              --body-file pins-report.md
          else
            gh pr edit "$URL" \
              --title "chore(pins): bump third-party skill SHAs to upstream HEAD" \
              --body-file pins-report.md
          fi
